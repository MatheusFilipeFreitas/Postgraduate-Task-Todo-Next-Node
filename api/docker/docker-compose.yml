services:
  postgres:
    image: postgres:16-alpine
    container_name: task-todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_todo}
      POSTGRES_USER: ${POSTGRES_USER:-task_todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_todo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-task_todo} -d ${POSTGRES_DB:-task_todo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
